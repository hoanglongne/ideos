# Push lên main: test + build + kiểm thử e2e, qua hết thì deploy lên Cloudflare.
# PR và nhánh khác: chỉ kiểm tra, không deploy.
# Cần 2 secret trong Settings → Secrets and variables → Actions: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
name: Kiểm tra và deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Hai lần push sát nhau thì chạy lần lượt, không deploy chồng lên nhau
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Test
        run: npm test

      - name: Typecheck + build
        run: npm run build

  # Trình duyệt thật chạy trên bản build + Worker cục bộ (D1 giả, AI giả): ghi offline, đồng bộ hai máy,
  # bài toán tiền, điện thoại, sao lưu. Chạy song song với job build.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Cài trình duyệt cho Playwright
        run: npx playwright install --with-deps chromium

      - name: E2E
        run: npm run e2e

      - name: Lưu vết khi lỗi
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  deploy:
    needs: [build, e2e]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy lên Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Thiếu secret CLOUDFLARE_API_TOKEN hoặc CLOUDFLARE_ACCOUNT_ID (Settings → Secrets and variables → Actions)."
            exit 1
          fi
          node scripts/ci-d1-id.mjs
          npx wrangler d1 migrations apply ideos --remote
          npx wrangler deploy
