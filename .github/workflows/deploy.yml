# Push lên main: test + build, qua hết thì deploy lên Cloudflare.
# PR và nhánh khác: chỉ test + build, không deploy.
# Cần 2 secret trong Settings → Secrets and variables → Actions: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
name: Kiểm tra và deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Hai lần push sát nhau thì chạy lần lượt, không deploy chồng lên nhau
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Test
        run: npm test

      - name: Typecheck + build
        run: npm run build

      - name: Deploy lên Cloudflare
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Thiếu secret CLOUDFLARE_API_TOKEN hoặc CLOUDFLARE_ACCOUNT_ID (Settings → Secrets and variables → Actions)."
            exit 1
          fi
          node scripts/ci-d1-id.mjs
          npx wrangler d1 migrations apply ideos --remote
          npx wrangler deploy
